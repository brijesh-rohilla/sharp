<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Post Highlighter</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e3f;
      --accent: #fda085;
      --accent2: #f6d365;
      --accent-glow: rgba(253, 160, 133, 0.25);
      --text: #f0eff6;
      --text-muted: #8887a0;
      --radius: 10px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a1a24 0%, #0f0f13 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 18px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .header-text h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--text);
    }

    .header-text p {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* ── Body ── */
    .body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }

    /* ── Keyword input area ── */
    .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]::placeholder { color: var(--text-muted); }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-add {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none;
      border-radius: var(--radius);
      color: #1a1a2e;
      font-size: 18px;
      font-weight: 700;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-add:hover { opacity: 0.9; transform: scale(1.06); }
    .btn-add:active { transform: scale(0.97); }

    /* ── Keyword chips ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 0;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px 4px 12px;
      font-size: 12px;
      color: var(--text);
      animation: chipIn 0.15s ease;
    }

    @keyframes chipIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    .chip-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .chip-remove:hover { color: var(--accent); }

    .no-keywords {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
    }

    /* ── Status badge ── */
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-count {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }

    .dot.active {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 6px var(--accent-glow); }
      50%       { box-shadow: 0 0 12px rgba(253, 160, 133, 0.6); }
    }

    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .status-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Navigation ── */
    .nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-nav {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 10px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .btn-nav:hover:not(:disabled) {
      background: var(--surface2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-nav:active:not(:disabled) { transform: scale(0.97); }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-nav svg { flex-shrink: 0; }

    /* ── Clear button ── */
    .btn-clear {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 12px;
      padding: 9px 0;
      cursor: pointer;
      width: 100%;
      transition: color 0.15s, border-color 0.15s;
    }

    .btn-clear:hover { color: #e07070; border-color: #e07070; }

    /* ── Footer ── */
    .footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-badge {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .scroll-indicator {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .scroll-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #4caf8a;
      box-shadow: 0 0 4px rgba(76, 175, 138, 0.6);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">🔍</div>
    <div class="header-text">
      <h1>Post Highlighter</h1>
      <p>LinkedIn keyword navigator</p>
    </div>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Keyword Input -->
    <div>
      <div class="label">Keywords</div>
      <div class="input-row">
        <input type="text" id="kw-input" placeholder="e.g. hiring, remote, AI…" autocomplete="off" />
        <button class="btn-add" id="btn-add" title="Add keyword">+</button>
      </div>
    </div>

    <!-- Chips -->
    <div id="chips-container" class="chips">
      <span class="no-keywords" id="no-kw-hint">No keywords yet — add one above</span>
    </div>

    <div class="divider"></div>

    <!-- Status -->
    <div class="status">
      <div class="status-count">
        <div class="dot" id="status-dot"></div>
        <span class="status-text" id="status-text">No matches</span>
      </div>
      <span class="status-sub" id="status-sub"></span>
    </div>

    <!-- Navigation -->
    <div class="nav">
      <button class="btn-nav" id="btn-prev" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Previous
      </button>
      <button class="btn-nav" id="btn-next" disabled>
        Next
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 6 15 12 9 18"/>
        </svg>
      </button>
    </div>

    <!-- Clear -->
    <button class="btn-clear" id="btn-clear">✕ &nbsp;Clear all highlights</button>

  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-badge">⚡ Manifest V3</div>
    <div class="scroll-indicator">
      <div class="scroll-dot"></div>
      Infinite scroll active
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
