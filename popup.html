<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharp</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/popup.css" />
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">🔍</div>
    <div class="header-text">
      <h1>Post Highlighter</h1>
      <p>LinkedIn keyword navigator</p>
    </div>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Keyword Input -->
    <div>
      <div class="label">Keywords</div>
      <div class="input-row">
        <input type="text" id="kw-input" placeholder="e.g. hiring, remote, AI…" autocomplete="off" />
        <button class="btn-add" id="btn-add" title="Add keyword">+</button>
      </div>
    </div>

    <!-- Chips -->
    <div id="chips-container" class="chips">
      <span class="no-keywords" id="no-kw-hint">No keywords yet — add one above</span>
    </div>

    <div class="divider"></div>

    <!-- Status -->
    <div class="status">
      <div class="status-count">
        <div class="dot" id="status-dot"></div>
        <span class="status-text" id="status-text">No matches</span>
      </div>
      <span class="status-sub" id="status-sub"></span>
    </div>

    <!-- Navigation -->
    <div class="nav">
      <button class="btn-nav" id="btn-prev" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Previous
      </button>
      <button class="btn-nav" id="btn-next" disabled>
        Next
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 6 15 12 9 18"/>
        </svg>
      </button>
    </div>

    <!-- Clear -->
    <button class="btn-clear" id="btn-clear">✕ &nbsp;Clear all highlights</button>

  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-badge">⚡ Manifest V3</div>
    <div class="scroll-indicator">
      <div class="scroll-dot"></div>
      Infinite scroll active
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
